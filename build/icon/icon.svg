<?xml version="1.0" encoding="UTF-8"?>
<!--
  JazzReader — иконка приложения.
  Тема TokyoNight:  bg #1a1b26 / #16161e, fg #c0caf5, blue #7aa2f7, cyan #7dcfff,
                     fg_gutter #3b4261 (обводка), terminal_black #414868.
  Шрифт букв — JetBrains Mono, тот же, что в интерфейсе. В системе его на
  Windows нет, поэтому font-family из этого файла сам по себе не сработает:
  make-icons.js подкладывает @font-face с woff2 из проекта. Проверяй иконку
  только через него, иначе получишь запасной моноширинный шрифт.

  Моноширинный — значит трекинг не нужен: обе буквы имеют одинаковую ширину,
  letter-spacing стоит 0. Кегль 120 кладёт «JR» шириной 137 и высотой 89 при
  x=129 / y=171.5 — по центру плитки 256×256 (центр букв 127, 128). Раньше
  буквы были Arial Black 94px и лежали 138x69, но моноширинный ExtraBold
  заметно компактнее по ширине, поэтому кегль пришлось поднять.
  Если правишь текст — прогони make-icons.js и сверь test/icon.test.js,
  он проверяет геометрию по пикселям.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2333"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54"
        fill="url(#plate)" stroke="#3b4261" stroke-width="4"/>

  <text x="129" y="171.5" text-anchor="middle"
        font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace"
        font-size="120" font-weight="800" fill="url(#ink)">JR</text>
</svg>