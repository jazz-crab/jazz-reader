<?xml version="1.0" encoding="UTF-8"?>
<!--
  JazzReader — the application icon.
  TokyoNight palette: bg #1a1b26 / #16161e, fg #c0caf5, blue #7aa2f7,
                      fg_gutter #3b4261 (stroke), terminal_black #414868.
  The letters use JetBrains Mono, the same font as the interface. Windows has
  no such font in the system, so font-family alone is not enough: make-icons.js
  injects an @font-face with the project's woff2. Always check the icon through
  it, otherwise you get the fallback monospace font.

  Monospace — no tracking: the two letters share the width, letter-spacing is 0.
  Size 120 places "JR" 137 wide and 89 high at x=129 / y=171.5 — centred on the
  256x256 tile (letter centre 127, 128). Arial Black 94px used to lay 138x69,
  but monospace ExtraBold is noticeably narrower, so the size was raised.

  The ink is solid, a single colour: the old blue-to-cyan horizontal gradient is
  gone. The Jazz suite shares one tile, and the accent per app is what tells the
  icons apart; a gradient inside the letters only smears the 16px layers.
  If you touch the text, run make-icons.js and compare test/icon.test.js — it
  checks the geometry pixel by pixel.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2333"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54"
        fill="url(#plate)" stroke="#3b4261" stroke-width="4"/>

  <text x="129" y="171.5" text-anchor="middle"
        font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace"
        font-size="120" font-weight="800" fill="#7aa2f7">JR</text>
</svg>