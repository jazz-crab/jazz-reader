<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Шрифты и KaTeX локальные: приложение обязано работать без сети. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' file: data:; connect-src 'none'">
  <title>MDView</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ============ Вкладки (в т.ч. под системными кнопками окна) ============ -->
    <div class="tabbar" id="tabbar">
      <button class="tab-new" id="btnNewTab" title="Новая вкладка (Ctrl+T)">+</button>
      <div class="tabs" id="tabs"></div>
      <div class="tabbar-spacer"></div>
    </div>

    <!-- ============ Панель инструментов ============ -->
    <div class="topbar">
      <button class="btn" id="btnOpenFile" title="Открыть .md (Ctrl+O)">
        <span class="ico" data-i="file-text"></span><span class="lbl">Файл</span>
      </button>
      <button class="btn" id="btnOpenFolder" title="Открыть папку (Ctrl+Shift+O)">
        <span class="ico" data-i="folder-open"></span><span class="lbl">Папка</span>
      </button>

      <span class="sep"></span>

      <button class="btn ico-only" id="btnBack" title="Назад (Alt+&#8592;)" disabled><span class="ico" data-i="arrow-left"></span></button>
      <button class="btn ico-only" id="btnForward" title="Вперёд (Alt+&#8594;)" disabled><span class="ico" data-i="arrow-right"></span></button>

      <span class="sep"></span>

      <button class="btn" id="btnMode" title="Режим правки (Ctrl+E)">
        <span class="ico" data-i="pencil"></span><span class="lbl">Правка</span>
      </button>
      <!-- В режиме правки вместо одной кнопки «Правка» — явная пара
           действий: зелёная «Сохранить» и красная «Отменить». Раньше был
           единственный переключатель, который молча уходил из правки и
           оставлял изменения в памяти — их можно было потерять, ничего
           не спрашивая. -->
      <button class="btn btn-save" id="btnSave" title="Сохранить на диск (Ctrl+S)" hidden>
        <span class="ico" data-i="save"></span><span class="lbl">Сохранить</span>
      </button>
      <button class="btn btn-cancel" id="btnCancelEdit" title="Отменить правки и вернуться к чтению (Esc)" hidden>
        <span class="ico" data-i="x"></span><span class="lbl">Отменить</span>
      </button>

      <div class="grow"></div>

      <span class="filename" id="fileName">—</span>
      <span class="sep"></span>

      <button class="btn ico-only" id="btnZoomOut" title="Уменьшить"><span class="ico" data-i="zoom-out"></span></button>
      <span class="zoomval" id="zoomVal">100%</span>
      <button class="btn ico-only" id="btnZoomIn" title="Увеличить"><span class="ico" data-i="zoom-in"></span></button>

      <div class="dropdown">
        <button class="btn ico-only" id="dlBtn" title="Скачать / печать"><span class="ico" data-i="download"></span></button>
        <div class="dropdown-menu" id="dlMenu">
          <button data-act="download-md"><span class="ico" data-i="file-down"></span>Скачать MD</button>
          <button data-act="download-html"><span class="ico" data-i="file-code"></span>Скачать HTML</button>
          <button data-act="print"><span class="ico" data-i="printer"></span>Печать / PDF&#8230;</button>
          <button data-act="reveal"><span class="ico" data-i="folder-search"></span>Показать в проводнике</button>
          <button data-act="copy-path"><span class="ico" data-i="copy"></span>Скопировать путь</button>
        </div>
      </div>

      <button class="btn ico-only" id="btnToc" title="Оглавление (Ctrl+Shift+B)" hidden><span class="ico" data-i="list-tree"></span></button>
      <button class="btn ico-only" id="btnSidebar" title="Панель (Ctrl+B)"><span class="ico" data-i="panel-left"></span></button>
    </div>

    <!-- ============ Пустое состояние / дропзона ============ -->
    <div class="welcome" id="welcome">
      <h1>MDView</h1>
      <p class="sub">Читалка Markdown с поддержкой LaTeX</p>
      <div class="drop-hint" id="dropHint">
        <p>Перетащи сюда файл <code>.md</code> или папку с заметками</p>
        <div class="welcome-btns">
          <button class="big-btn" id="wOpenFile"><span class="ico" data-i="file-text"></span>Открыть .md</button>
          <button class="big-btn" id="wOpenFolder"><span class="ico" data-i="folder-open"></span>Открыть папку</button>
        </div>
      </div>
      <div class="keys">
        <div><kbd>Ctrl</kbd>+<kbd>O</kbd> файл &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>&#8679;</kbd>+<kbd>O</kbd> папка</div>
        <div><kbd>Alt</kbd>+<kbd>&#8592;</kbd>/<kbd>&#8594;</kbd> назад / вперёд &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>T</kbd> новая вкладка</div>
        <div><kbd>Ctrl</kbd>+<kbd>E</kbd> правка &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>S</kbd> сохранить / скачать</div>
      </div>
    </div>

    <!-- ============ Основная область ============ -->
    <div class="workspace" id="workspace" hidden>
      <!-- Проводник всегда слева и без переключателя: он нужен постоянно.
           Оглавление убрано в отдельный выдвижной оверлей по кнопке-бургеру
           в тулбаре — раньше оно делило с проводником одну панель переключателем
           «Файлы/Оглавление», и ради оглавления приходилось терять проводник. -->
      <aside class="sidebar" id="sidebar">
        <div class="side-head">
          <span class="side-title">Файлы</span>
          <button class="side-collapse" id="btnCollapseToc" title="Скрыть проводник (Ctrl+B)"><span class="ico" data-i="x"></span></button>
        </div>
        <div class="side-search">
          <span class="s-ico" data-i="search"></span>
          <input type="text" id="treeFilter" placeholder="Фильтр по имени&#8230;" spellcheck="false">
        </div>
        <div class="side-pane" id="paneFiles"></div>
      </aside>

      <div class="sidebar-resizer" id="sidebarResizer" title="Потяни, чтобы изменить ширину"></div>

      <!-- Оглавление: выдвижная панель поверх основной области -->
      <div class="toc-overlay" id="tocOverlay" hidden>
        <div class="toc-panel">
          <div class="side-head">
            <span class="side-title">Оглавление</span>
            <button class="side-collapse" id="btnCloseToc" title="Закрыть оглавление (Esc)"><span class="ico" data-i="x"></span></button>
          </div>
          <div class="side-pane" id="paneToc"></div>
        </div>
      </div>

      <main class="main">
        <article class="content" id="content"></article>
        <textarea class="editor" id="editor" spellcheck="false" hidden></textarea>
      </main>

      <button class="to-top" id="toTop" title="Наверх" hidden><span class="ico" data-i="arrow-up"></span></button>
    </div>

    <footer class="statusbar" id="statusbar" hidden><span id="statusText">Готово</span></footer>
  </div>

  <div class="drop-overlay" id="dropOverlay"><div>Отпусти, чтобы открыть</div></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="icons.js"></script>
  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
