<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Шрифты и KaTeX локальные: приложение обязано работать без сети. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' file: data:; connect-src 'none'">
  <title>MDView</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ============ Вкладки ============
         Слева иконка приложения, справа «+». Раньше «+» стоял перед вкладками,
         а справа была пустая распорка — визуально кнопка «новая вкладка»
         прилипала к первой вкладке и читалась как часть её.

         Полоса вкладок обёрнута в .tabs-wrap: внутри неё сама лента и две
         кнопки-шеврона, которые появляются только когда вкладки не влезают.
         Раньше лента просто уезжала за край окна без всякой прокрутки. -->
    <div class="tabbar" id="tabbar">
      <!-- Гамбургер, а не иконка приложения. Иконка exe в полосе вкладок
           читалась как ещё одна вкладка (тот же квадрат, тот же размер), и
           приходилось думать, что она открывается по клику. Три полоски
           однозначно означают меню, и площадь кнопки ближе к квадратной,
           поэтому по ней проще попасть мышью. -->
      <button class="tabbar-brand" id="appBrand" title="Меню: Файл, Вид, Настройки" aria-haspopup="menu" aria-label="Меню">
        <span class="ico" data-i="menu"></span>
      </button>

      <div class="tabs-wrap" id="tabsWrap">
        <button class="tabs-nav left" id="tabsLeft" title="Вкладки левее" aria-label="Вкладки левее" hidden>
          <span class="ico" data-i="chevron-left"></span>
        </button>
        <div class="tabs" id="tabs"></div>
        <button class="tabs-nav right" id="tabsRight" title="Вкладки правее" aria-label="Вкладки правее" hidden>
          <span class="ico" data-i="chevron-right"></span>
        </button>
      </div>

      <!-- Плюсик просто открывает новую вкладку. Мини-меню убрано: ради
           пустой вкладки не надо в неё нырять, а файлы/папки открываются
           кнопками тулбара. -->
      <button class="tab-new" id="btnNewTab" title="Новая вкладка (Ctrl+T)"><span class="ico" data-i="plus"></span></button>

      <div class="tabbar-spacer"></div>
    </div>

    <!-- ============ Панель инструментов ============
         Кнопок «Файл» и «Папка» здесь больше нет: то же самое делают
         Ctrl+O / Ctrl+Shift+O, пункт «Файл» в меню иконки и ПКМ по «+».
         Держать одно и то же в четырёх местах — значит править в четырёх
         местах. -->
    <!-- Тулбар разложен на три группы сеткой 1fr auto 1fr. Именно сетка даёт
         ТОЧНО по центру: во flex группа с flex:1 получает половину свободного
         места, и со сдвигом на половину ширины левой группы — масштаб
         уезжал от середины. -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn ico-only" id="btnBack" title="Назад (Alt+&#8592;)" disabled><span class="ico" data-i="arrow-left"></span></button>
        <button class="btn ico-only" id="btnForward" title="Вперёд (Alt+&#8594;)" disabled><span class="ico" data-i="arrow-right"></span></button>
        <span class="sep"></span>
      </div>

      <!-- «Правка» уехала в левый нижний угол заметки (см. #modeDock).
           В тулбаре остаётся только то, что относится к самой панели.

           Зелёная «Сохранить» и красная «Отменить» живут рядом с ней же,
           по той же причине: режим правки — это состояние заметки, а не
           панели. В тулбаре держать вторую «Сохранить» было бы прямое
           столкновение с этой. -->

      <!-- Масштаб — по центру тулбара, а не сбоку от кнопок навигации:
           им пользуются постоянно, и искать их в углу неудобно.

           Процент — поле ввода, а не подпись: «+» и «−» дают только шаг, а
           нужно ещё и 83% или 175%. Именно input, а не contenteditable:
           тот не мешает выделять текст и не требует заново вставлять узел
           при каждой перерисовке. -->
      <div class="topbar-center">
        <button class="btn ico-only" id="btnZoomOut" title="Уменьшить (Ctrl+−)"><span class="ico" data-i="zoom-out"></span></button>
        <input class="zoomval" id="zoomVal" type="text" value="100%"
               spellcheck="false" autocomplete="off" inputmode="decimal"
               title="Масштаб: впиши число, например 85 или 175 (Enter)">
        <button class="btn ico-only" id="btnZoomIn" title="Увеличить (Ctrl++)"><span class="ico" data-i="zoom-in"></span></button>
      </div>

      <div class="topbar-right">
      <!-- «Экспорт» — это сохранение ОТДЕЛЬНЫМ файлом, а не «Сохранить»
           заметку на диск, поэтому и иконка другая, и слово другое:
           зелёная «Сохранить» принадлежит правке, эта — выгрузке копии. -->
      <div class="dropdown">
        <button class="btn ico-only" id="dlBtn" title="Экспорт: сохранить копией / печать"><span class="ico" data-i="folder-output"></span></button>
        <div class="dropdown-menu" id="dlMenu">
          <button data-act="download-md"><span class="ico" data-i="file-down"></span>Сохранить MD</button>
          <button data-act="download-html"><span class="ico" data-i="file-code"></span>Сохранить HTML</button>
          <button data-act="print"><span class="ico" data-i="printer"></span>Печать / PDF&#8230;</button>
          <button data-act="reveal"><span class="ico" data-i="folder-search"></span>Показать в проводнике</button>
          <button data-act="copy-path"><span class="ico" data-i="copy"></span>Скопировать путь</button>
        </div>
      </div>

      <!-- Кнопок «Оглавление» и «Проводник» здесь больше нет: то же самое
           делают иконка приложения -> Вид (галочки) и Ctrl+B / Ctrl+Shift+B.
           Держать одно и то же в двух местах — значит потом править в двух
           местах; в тулбаре от них оставалось два лишних значка, которые
           ещё и дублировали состояние (подсвечивались, когда панель открыта). -->
      </div>
    </div>

    <!-- ============ Индикатор загрузки ============
         Показывается на всё время открытия файла: чтение с диска, рендер
         Markdown и вставка в DOM на большой заметке занимают доли секунды,
         и без него окно выглядит просто зависшим. -->
    <div class="loading" id="loading" hidden aria-live="polite">
      <div class="loading-card">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loading-text" id="loadingText">Открываю…</div>
        <div class="loading-sub" id="loadingSub"></div>
      </div>
    </div>

    <!-- ============ Пустое состояние / дропзона ============ -->
    <div class="welcome" id="welcome">
      <h1>MDView</h1>
      <p class="sub">Читалка Markdown</p>
      <div class="drop-hint" id="dropHint">
        <p>Перетащи сюда файл <code>.md</code> или папку с заметками</p>
        <div class="welcome-btns">
          <button class="big-btn" id="wOpenFile"><span class="ico" data-i="file-text"></span>Открыть .md</button>
          <button class="big-btn" id="wOpenFolder"><span class="ico" data-i="folder-open"></span>Открыть папку</button>
        </div>
      </div>
      <div class="keys">
        <div><kbd>Ctrl</kbd>+<kbd>O</kbd> файл &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>&#8679;</kbd>+<kbd>O</kbd> папка</div>
        <div><kbd>Alt</kbd>+<kbd>&#8592;</kbd>/<kbd>&#8594;</kbd> назад / вперёд &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>T</kbd> новая вкладка</div>
        <div><kbd>Ctrl</kbd>+<kbd>E</kbd> правка &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>S</kbd> сохранить</div>
      </div>
    </div>

    <!-- ============ Основная область ============
         Оглавление слева, проводник справа. Раньше проводник был слева, а
         оглавление выезжало поверх текста — ради оглавления приходилось
         терять проводник, а ради проводника — текст.
         Обе панели скрываются независимо: иконка приложения -> Вид.
         Вкладки не скрываются никогда. -->
    <div class="workspace" id="workspace" hidden>
      <!-- Шапки панелей убраны: «ОГЛАВЛЕНИЕ» и «ПРОВОДНИК» занимали 33px
           каждая и ничего не говорили — по содержимому и так видно, где что.
           Прятать панели теперь только через меню (Вид) и хоткеи. -->
      <aside class="sidebar side-left" id="tocSide">
        <div class="side-pane" id="paneToc"></div>
      </aside>
      <div class="sidebar-resizer" id="tocResizer" title="Потяни, чтобы изменить ширину"></div>

      <!-- Разделение экрана: слева рабочая заметка (она же активная вкладка),
           справа вторая, с узкой шапкой. Полоса вкладок сверху одна на обе
           панели — вкладка второй панели помечена цветной кромкой слева.
           Появляется, когда вкладку тянут из ленты в поле заметки. -->
      <div class="split" id="split">
      <!-- id нужен для акцента «панель в фокусе»: правило по классу .main
           попадало бы и в правую панель, потому что .main-second наследует
           .main — и подсветка горела на обеих сразу. -->
      <main class="main" id="mainPane">
        <article class="content" id="content"></article>
        <textarea class="editor" id="editor" spellcheck="false" hidden></textarea>

        <!-- Режим правки — по центру низа заметки, круглыми кнопками без
             подписей.

             Раньше они стояли в левом нижнем углу прямоугольными плашками с
             текстом. Текст здесь лишний: у кнопок есть подсказки, а «Сохранить»
             и «Отменить» занимали ширину, которой у правой кромки заметки и так
             не хватало.

             Логика та же, что и была: в чтении одна кнопка «Правка», в правке
             вместо неё — явная пара действий. Одиночный переключатель раньше
             молча уходил из правки и оставлял изменения в памяти: их можно было
             потерять, ничего не спрашивая.

             Порядок в DOM — «Правка», потом стопка «Отменить» над «Сохранить»,
             и обе выровнены по низу (align-items:flex-end). Поэтому карандаш и
             «Сохранить» стоят на одном месте, ничего не прыгает при входе в
             правку, а «Отменить» появляется НАД «Сохранить». -->
        <div class="mode-dock" id="modeDock">
          <button class="rnd rnd-edit" id="btnMode" title="Режим правки (Ctrl+E)" aria-label="Режим правки">
            <span class="ico" data-i="pencil"></span>
          </button>
          <div class="dock-stack">
            <button class="rnd rnd-cancel" id="btnCancelEdit" title="Отменить правки и вернуться к чтению (Esc)" aria-label="Отменить правки" hidden>
              <span class="ico" data-i="x"></span>
            </button>
            <button class="rnd rnd-save" id="btnSave" title="Сохранить на диск (Ctrl+S)" aria-label="Сохранить" hidden>
              <span class="ico" data-i="save"></span>
            </button>
          </div>
        </div>
      </main>

        <div class="split-divider" id="splitDivider" title="Потяни, чтобы изменить ширину" hidden></div>

        <section class="main main-second" id="panel2" hidden>
          <header class="second-head">
            <span class="side-title" id="secondTitle"></span>
            <button class="side-collapse" id="btnHideSecond" title="Закрыть правую панель"><span class="ico" data-i="x"></span></button>
          </header>
          <div class="content content-second" id="content2"></div>
        </section>
      </div>

      <div class="sidebar-resizer" id="filesResizer" title="Потяни, чтобы изменить ширину"></div>

      <aside class="sidebar side-right" id="filesSide">
        <div class="side-search">
          <span class="s-ico" data-i="search"></span>
          <input type="text" id="treeFilter" placeholder="Фильтр по имени&#8230;" spellcheck="false">
        </div>
        <div class="side-pane" id="paneFiles"></div>
      </aside>

      <button class="to-top" id="toTop" title="Наверх" hidden><span class="ico" data-i="arrow-up"></span></button>
    </div>

    <!-- Нижняя панель: слева путь к файлу, справа последнее сообщение.
         Раньше путь висел по центру тулбара, а статус занимал всю строку
         слева, из-за чего длинный путь вытеснял сообщение. -->
    <footer class="statusbar" id="statusbar" hidden>
      <span class="status-path" id="fileName"></span>
      <span class="status-grow"></span>
      <span id="statusText">Готово</span>
    </footer>
  </div>

  <div class="drop-overlay" id="dropOverlay"><div>Отпусти, чтобы открыть</div></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="icons.js"></script>
  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
