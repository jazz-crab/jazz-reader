<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Шрифты и KaTeX локальные: приложение обязано работать без сети. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' file: data:; connect-src 'none'">
  <title>MDView</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ============ Вкладки (в т.ч. под системными кнопками окна) ============ -->
    <div class="tabbar" id="tabbar">
      <button class="tab-new" id="btnNewTab" title="Новая вкладка (Ctrl+T)">+</button>
      <div class="tabs" id="tabs"></div>
      <div class="tabbar-spacer"></div>
    </div>

    <!-- ============ Панель инструментов ============ -->
    <div class="topbar">
      <button class="btn" id="btnOpenFile" title="Открыть .md (Ctrl+O)">
        <span class="ico">&#xf07b;</span><span class="lbl">Файл</span>
      </button>
      <button class="btn" id="btnOpenFolder" title="Открыть папку (Ctrl+Shift+O)">
        <span class="ico">&#xf07b;</span><span class="lbl">Папка</span>
      </button>

      <span class="sep"></span>

      <button class="btn ico-only" id="btnBack" title="Назад (Alt+&#8592;)" disabled>&#xf104;</button>
      <button class="btn ico-only" id="btnForward" title="Вперёд (Alt+&#8594;)" disabled>&#xf105;</button>

      <span class="sep"></span>

      <button class="btn" id="btnMode" title="Режим правки (Ctrl+E)">
        <span class="ico">&#xf044;</span><span class="lbl">Правка</span>
      </button>
      <button class="btn" id="btnSave" title="Сохранить (Ctrl+S)" hidden>
        <span class="ico">&#xf0c7;</span><span class="lbl">Сохранить</span>
      </button>

      <div class="grow"></div>

      <span class="filename" id="fileName">—</span>
      <span class="sep"></span>

      <button class="btn ico-only" id="btnZoomOut" title="Уменьшить">&#xf068;</button>
      <span class="zoomval" id="zoomVal">100%</span>
      <button class="btn ico-only" id="btnZoomIn" title="Увеличить">&#xf067;</button>

      <div class="dropdown">
        <button class="btn ico-only" id="dlBtn" title="Скачать / печать">&#xf019;</button>
        <div class="dropdown-menu" id="dlMenu">
          <button data-act="download-md">Скачать MD</button>
          <button data-act="download-html">Скачать HTML</button>
          <button data-act="print">Печать / PDF&#8230;</button>
          <button data-act="reveal">Показать в проводнике</button>
          <button data-act="copy-path">Скопировать путь</button>
        </div>
      </div>

      <button class="btn ico-only" id="btnSidebar" title="Панель (Ctrl+B)">&#xf0c9;</button>
    </div>

    <!-- ============ Пустое состояние / дропзона ============ -->
    <div class="welcome" id="welcome">
      <h1>MDView</h1>
      <p class="sub">Читалка Markdown с поддержкой LaTeX</p>
      <div class="drop-hint" id="dropHint">
        <p>Перетащи сюда файл <code>.md</code> или папку с заметками</p>
        <div class="welcome-btns">
          <button class="big-btn" id="wOpenFile"><span class="ico">&#xf15b;</span>Открыть .md</button>
          <button class="big-btn" id="wOpenFolder"><span class="ico">&#xf07b;</span>Открыть папку</button>
        </div>
      </div>
      <div class="keys">
        <div><kbd>Ctrl</kbd>+<kbd>O</kbd> файл &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>&#8679;</kbd>+<kbd>O</kbd> папка</div>
        <div><kbd>Alt</kbd>+<kbd>&#8592;</kbd>/<kbd>&#8594;</kbd> назад / вперёд &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>T</kbd> новая вкладка</div>
        <div><kbd>Ctrl</kbd>+<kbd>E</kbd> правка &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>S</kbd> сохранить / скачать</div>
      </div>
    </div>

    <!-- ============ Основная область ============ -->
    <div class="workspace" id="workspace" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="side-switch">
          <button class="side-btn active" data-pane="files">Файлы</button>
          <button class="side-btn" data-pane="toc">Оглавление</button>
        </div>
        <div class="side-search">
          <input type="text" id="treeFilter" placeholder="Фильтр по имени&#8230;" spellcheck="false">
        </div>
        <div class="side-pane" id="paneFiles"></div>
        <div class="side-pane" id="paneToc" hidden></div>
      </aside>

      <div class="sidebar-resizer" id="sidebarResizer" title="Потяни, чтобы изменить ширину"></div>

      <main class="main">
        <article class="content" id="content"></article>
        <textarea class="editor" id="editor" spellcheck="false" hidden></textarea>
      </main>

      <button class="to-top" id="toTop" title="Наверх" hidden>&#xf062;</button>
    </div>

    <footer class="statusbar" id="statusbar" hidden><span id="statusText">Готово</span></footer>
  </div>

  <div class="drop-overlay" id="dropOverlay"><div>Отпусти, чтобы открыть</div></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
